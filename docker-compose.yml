version: '3.8'

services:
  # Frontend Web UI
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sc1-frontend
    ports:
      - "9050:3000"
    networks:
      - sc1-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Game Server Instance 1 - Terran
  game-server-1:
    build:
      context: .
      dockerfile: docker/game-server/Dockerfile
    image: sc1-game-server:latest
    container_name: sc1-game-terran
    ports:
      - "6122:6080"
      - "8081:8000"
      - "8091:6081"
    environment:
      - DISPLAY=:99
      - RACE_NAME=TERRAN
      - RACE_COLOR=#00b4ff
      - AUDIO_PORT=8081
      - STATUS_PORT=6081
    networks:
      - sc1-network
    restart: unless-stopped

  # Game Server Instance 2 - Protoss
  game-server-2:
    build:
      context: .
      dockerfile: docker/game-server/Dockerfile
    image: sc1-game-server:latest
    container_name: sc1-game-protoss
    ports:
      - "6223:6080"
      - "8082:8000"
      - "8092:6081"
    environment:
      - DISPLAY=:99
      - RACE_NAME=PROTOSS
      - RACE_COLOR=#ffd700
      - AUDIO_PORT=8082
      - STATUS_PORT=6081
    networks:
      - sc1-network
    restart: unless-stopped

  # Game Server Instance 3 - Zerg
  game-server-3:
    build:
      context: .
      dockerfile: docker/game-server/Dockerfile
    image: sc1-game-server:latest
    container_name: sc1-game-zerg
    ports:
      - "6324:6080"
      - "8083:8000"
      - "8093:6081"
    environment:
      - DISPLAY=:99
      - RACE_NAME=ZERG
      - RACE_COLOR=#a020f0
      - AUDIO_PORT=8083
      - STATUS_PORT=6081
    networks:
      - sc1-network
    restart: unless-stopped


networks:
  sc1-network:
    driver: bridge
