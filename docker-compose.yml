version: '3.8'

services:
  # Frontend Web UI
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_PUBLIC_DOMAIN=${PUBLIC_DOMAIN:-}
    container_name: sc1-frontend
    ports:
      - "4000:3000"
    networks:
      - sc1-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Game Server Instance 1 - Terran
  game-server-1:
    build:
      context: .
      dockerfile: docker/game-server/Dockerfile
    image: sc1-game-server:latest
    container_name: sc1-game-terran
    ports:
      - "4001:6080"
      - "4002:8000"
      - "4003:6081"
    environment:
      - DISPLAY=:99
      - RACE_NAME=TERRAN
      - RACE_COLOR=#00b4ff
      - AUDIO_PORT=4002
      - STATUS_PORT=6081
      - PUBLIC_DOMAIN=${PUBLIC_DOMAIN:-}
    volumes:
      - sc1_data_terran:/home/gamer/games/SC1
      - sc1_wine_terran:/home/gamer/.wine
    networks:
      - sc1-network
    restart: unless-stopped

  # Game Server Instance 2 - Protoss
  game-server-2:
    build:
      context: .
      dockerfile: docker/game-server/Dockerfile
    image: sc1-game-server:latest
    container_name: sc1-game-protoss
    ports:
      - "4004:6080"
      - "4005:8000"
      - "4006:6081"
    environment:
      - DISPLAY=:99
      - RACE_NAME=PROTOSS
      - RACE_COLOR=#ffd700
      - AUDIO_PORT=4005
      - STATUS_PORT=6081
      - PUBLIC_DOMAIN=${PUBLIC_DOMAIN:-}
    volumes:
      - sc1_data_protoss:/home/gamer/games/SC1
      - sc1_wine_protoss:/home/gamer/.wine
    networks:
      - sc1-network
    restart: unless-stopped

  # Game Server Instance 3 - Zerg
  game-server-3:
    build:
      context: .
      dockerfile: docker/game-server/Dockerfile
    image: sc1-game-server:latest
    container_name: sc1-game-zerg
    ports:
      - "4007:6080"
      - "4008:8000"
      - "4009:6081"
    environment:
      - DISPLAY=:99
      - RACE_NAME=ZERG
      - RACE_COLOR=#a020f0
      - AUDIO_PORT=4008
      - STATUS_PORT=6081
      - PUBLIC_DOMAIN=${PUBLIC_DOMAIN:-}
    volumes:
      - sc1_data_zerg:/home/gamer/games/SC1
      - sc1_wine_zerg:/home/gamer/.wine
    networks:
      - sc1-network
    restart: unless-stopped


networks:
  sc1-network:
    driver: bridge

volumes:
  sc1_data_terran:
    driver: local
  sc1_wine_terran:
    driver: local
  sc1_data_protoss:
    driver: local
  sc1_wine_protoss:
    driver: local
  sc1_data_zerg:
    driver: local
  sc1_wine_zerg:
    driver: local
